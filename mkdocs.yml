site_name: AlphaEvolve Documentation
site_description: Evolutionary Code Optimization with Large Language Models
site_author: AlphaEvolve Team
site_url: https://alphaevolve.github.io/

repo_name: alphaevolve/alphaevolve
repo_url: https://github.com/alphaevolve/alphaevolve
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.highlight
    - search.share
    - toc.follow
    - content.code.copy
    - content.action.edit
    - content.action.view
  font:
    text: Roboto
    code: Roboto Mono

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_toc_entry: false
            heading_level: 2
  - autorefs

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Configuration: getting-started/configuration.md
  - User Guide:
    - Overview: user-guide/overview.md
    - Marking Code for Evolution: user-guide/marking-code.md
    - Writing Evaluation Functions: user-guide/evaluation-functions.md
    - Running Evolution: user-guide/running-evolution.md
    - Monitoring Progress: user-guide/monitoring.md
    - Managing Checkpoints: user-guide/checkpoints.md
    - Configuration Reference: user-guide/configuration-reference.md
    - Troubleshooting: user-guide/troubleshooting.md
  - Examples:
    - Basic Optimization: examples/basic-optimization.md
    - Algorithm Optimization: examples/algorithm-optimization.md
    - Performance Tuning: examples/performance-tuning.md
    - Novel Algorithm Discovery: examples/novel-discovery.md
    - Research Applications: examples/research-applications.md
    - Analysis Tutorial: examples/analysis-tutorial.md
  - API Reference:
    - Core Modules: api-reference/core-modules.md
    - Task Utils: api-reference/task-utils.md
    - Program Database: api-reference/program-database.md
    - LLM Interface: api-reference/llm-interface.md
    - Evaluation Engine: api-reference/evaluation-engine.md
    - Sandboxing: api-reference/sandboxing.md
    - Persistence: api-reference/persistence.md
    - Controller: api-reference/controller.md
    - CLI: api-reference/cli.md
  - Advanced Topics:
    - Distributed Evolution: advanced/distributed-evolution.md
  - Developer Guide:
    - Architecture: developer-guide/architecture.md
    - Contributing: developer-guide/contributing.md
    - Testing: developer-guide/testing.md
    - Release Process: developer-guide/release-process.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/alphaevolve/alphaevolve
  version:
    provider: mike