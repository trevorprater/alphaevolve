[project]
name = "alphaevolve"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "aiohttp>=3.9.0",
    "docker>=7.1.0",
    "pydantic>=2.11.5",
    "pyyaml>=6.0.2",
    "pydantic-settings>=2.9.1",
    "rich>=13.0.0",
]

[project.scripts]
alphaevolve = "alpha_evolve.cli:cli_main"

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
