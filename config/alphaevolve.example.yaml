# AlphaEvolve Configuration Example
# Copy this file to alphaevolve.yaml and customize for your needs

# Global settings
project_name: "AlphaEvolve"
version: "1.0.0"
environment: "development"  # development, staging, production

# LLM Configuration
llm:
  default_provider: "anthropic"  # Primary provider to use
  fallback_provider: "mock"      # Fallback if primary fails
  
  providers:
    # OpenAI Configuration (supports o4, o3, o1 models)
    openai:
      api_key: "${OPENAI_API_KEY}"  # Set via environment variable
      model: "o1-mini"            # Options: o4, o4-mini, o3, o1, o1-mini, gpt-4, gpt-4o
      temperature: 0.2
      max_tokens: 2000
      timeout_seconds: 30
      rate_limit_rpm: 60
      # reasoning_effort: "medium"  # For o1 models: low, medium, high
    
    # Anthropic Configuration (supports Claude models with thinking)
    anthropic:
      api_key: "${ANTHROPIC_API_KEY}"
      model: "claude-3-5-sonnet-v2"  # Options: claude-opus-4, claude-sonnet-4, claude-3-5-sonnet-v2
      temperature: 0.2
      max_tokens: 2000
      timeout_seconds: 30
      rate_limit_rpm: 50
      use_thinking: true             # Enable thinking mode for Claude 4 models
      thinking_budget: 8192          # Token budget for thinking
    
    # Google Gemini API Configuration
    gemini:
      api_key: "${GOOGLE_API_KEY}"
      model: "gemini-2.5-flash"      # Options: gemini-2.5-flash, gemini-2.5-pro, gemini-2.0-flash
      temperature: 0.2
      max_tokens: 2000
      timeout_seconds: 30
      rate_limit_rpm: 60
    
    # Vertex AI Configuration (requires Google Cloud credentials)
    vertex_ai:
      # No API key needed - uses Application Default Credentials
      project: "${GOOGLE_CLOUD_PROJECT}"
      location: "us-central1"
      model: "gemini-2.5-flash"
      temperature: 0.2
      max_tokens: 2000
      timeout_seconds: 30
      rate_limit_rpm: 60
    
    # Mock Provider (for testing)
    mock:
      model: "mock-model"
      response_type: "flash"         # Options: flash, pro
      temperature: 0.2
      max_tokens: 2000

# Sandbox Configuration
sandbox:
  enabled: true
  type: "docker"  # docker or process
  
  # Resource limits
  cpu_limit: 1.0
  memory_limit: "256m"
  timeout_seconds: 30
  max_output_size: 1048576  # 1MB
  network_disabled: true
  
  # Docker settings
  docker_image: "alphaevolve-sandbox:latest"
  docker_pull_policy: "if_not_present"

# Database Configuration
database:
  type: "memory"  # memory, sqlite, postgresql
  # connection_string: "sqlite:///alphaevolve.db"
  
  # MAP-Elites settings
  feature_dimensions: ["complexity", "performance"]
  feature_bins: 10
  
  # Performance
  batch_size: 100
  connection_pool_size: 5
  
  # Persistence
  checkpoint_interval: 100
  auto_save: true

# Evolution Configuration
evolution:
  population_size: 100
  max_generations: 1000
  elite_ratio: 0.1
  
  # Selection and mutation
  selection_pressure: 2.0
  mutation_rate: 0.1
  crossover_rate: 0.8
  
  # Parallel processing
  parallel_evaluations: 4
  batch_evaluation: true
  
  # Migration (island model)
  migration_interval: 50
  migration_size: 5

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  # File logging
  file_enabled: true
  file_path: "alphaevolve.log"
  file_max_size: "10MB"
  file_backup_count: 5
  
  # Console logging
  console_enabled: true
  console_level: "INFO"
  
  # Metrics
  metrics_enabled: false
  metrics_port: 8000

# Security Configuration
security:
  # Credential encryption
  encrypt_credentials: false
  # encryption_key_path: "/path/to/encryption.key"
  
  # Sandbox security
  strict_sandbox: true
  allowed_imports:
    - "math"
    - "random"
    - "json"
    - "re"
    - "datetime"
  blocked_functions:
    - "exec"
    - "eval"
    - "compile"
    - "__import__"
  
  # Network security
  allowed_domains: []